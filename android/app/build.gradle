plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def signingFile = rootProject.file('key.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withReader('UTF-8') { signingValues.load(it) }

android {
    namespace = "dev.mydex.mydex_mobile"
    compileSdk = 36

    // Keep the normal versionCode when producing the ARM64-only private APK.
    if (System.getenv('MYDEX_PRIVATE_ARM64_APK') == '1') {
        packagingOptions {
            jniLibs {
                excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "dev.mydex.mydex_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        privateRelease {
            if (signingFile.exists()) {
                storeFile = file(signingValues['storeFile'])
                storePassword = signingValues['storePassword']
                keyAlias = signingValues['keyAlias']
                keyPassword = signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingFile.exists() ? signingConfigs.privateRelease : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
